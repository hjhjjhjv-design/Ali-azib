<title>علي عزيب</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow phone-first column. Large framed portrait, name with a short red rule, one primary link, two contact cards each with call / WhatsApp / Viber / copy. Dark navy ground, red accent taken from the cap in the portrait. */
:root {
  --bg: #08122b;
  --bg-glow: #14285a;
  --surface: #101f46;
  --surface-hi: #172b5c;
  --line: #2b4284;
  --line-soft: #1f3369;
  --fg: #f4f6fb;
  --muted: #9fb0d6;
  --accent: #e63950;
  --accent-deep: #b81f36;
  --accent-ink: #ffffff;
  --wa: #25d366;
  --wa-bg: #12392f;
  --vb: #a78bfa;
  --vb-bg: #2a2457;
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% 0%, var(--bg-glow) 0%, transparent 65%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 44px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main {
  max-width: 440px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 30px;
}
.portrait {
  position: relative;
  width: 150px;
  max-width: 100%;
  margin-inline: auto;
}
.portrait::before {
  content: "";
  position: absolute;
  inset: 14px -14px -14px 14px;
  border: 2px solid var(--accent);
  border-radius: 22px;
  opacity: 0.9;
}
.portrait::after {
  content: "";
  position: absolute;
  inset: 20px -6px -30px -6px;
  border-radius: 40px;
  background: var(--accent-deep);
  filter: blur(46px);
  opacity: 0.35;
  z-index: -1;
}
.portrait img {
  position: relative;
  display: block;
  width: 100%;
  height: auto;
  border-radius: 22px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.who { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.6rem;
  line-height: 1.15;
  text-wrap: balance;
}
.rule { width: 44px; height: 3px; border-radius: 3px; background: var(--accent); }
.who p { margin: 0; color: var(--muted); font-size: 1rem; letter-spacing: 0.02em; }
.link-fb {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 17px 20px;
  border-radius: 18px;
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
  color: var(--accent-ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.15rem;
  text-decoration: none;
  box-shadow: 0 10px 28px -10px var(--accent-deep);
}
.link-fb:hover { filter: brightness(1.08); }
.link-fb svg { width: 24px; height: 24px; flex: none; }
.contact { display: flex; flex-direction: column; gap: 14px; }
h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.phone {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px 16px 16px;
  border-radius: 20px;
  background: linear-gradient(180deg, var(--surface-hi) 0%, var(--surface) 100%);
  border: 1px solid var(--line);
}
.num {
  direction: ltr;
  text-align: center;
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
  user-select: all;
}
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.btn {
  min-width: 0;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 4px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.15); }
.btn.call { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.wa { background: var(--wa-bg); color: var(--wa); border-color: #1d5a45; }
.btn.vb { background: var(--vb-bg); color: var(--vb); border-color: #443a8a; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (max-width: 360px) {
  .actions { grid-template-columns: repeat(2, 1fr); }
  h1 { font-size: 2.2rem; }
}
</style>
